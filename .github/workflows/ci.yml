# ============================================================================
# CI pipeline for Document Intelligent System (LOCAL-ONLY FOR NOW)
# ----------------------------------------------------------------------------
# This workflow is intentionally NOT committed to git (see .gitignore:
# `.github/`). Deployment is not ready yet, so this file lives on disk only
# as a starting point for the DevOps section. To enable it later, remove
# `.github/` from .gitignore and push — GitHub Actions picks it up
# automatically. No code changes needed.
# ============================================================================

name: CI

on:
  push:
    branches: [main, hybrid-rag-cache-monitoring]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Backend: syntax + Django checks (no secrets, no network) ------------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (all app code must parse)
        working-directory: backend
        run: python -m compileall -q app django_backend

      - name: Django system checks (no DB writes)
        working-directory: backend
        run: python manage.py check

  # --- Frontend: production build must succeed ------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build (validates JSX + routes)
        working-directory: frontend
        run: npm run build
