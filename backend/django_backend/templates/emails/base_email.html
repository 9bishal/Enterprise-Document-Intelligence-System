<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>{% block title %}Intradoc AI{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f3ef;color:#111111;">
  <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">
    {% block preheader %}{% endblock %}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f3ef;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border:1px solid #e7e5df;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="height:3px;background-color:#863bff;font-size:0;line-height:0;">&nbsp;</td>
          </tr>

          <tr>
            <td style="padding:28px 36px 0 36px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="width:36px;height:36px;background-color:#111111;border-radius:9px;text-align:center;vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:0.5px;color:#ffffff;">ID</td>
                  <td style="padding-left:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:-0.3px;color:#111111;">Intradoc <span style="color:#863bff;">AI</span></td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 36px 0 36px;">
              <h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:24px;line-height:1.25;letter-spacing:-0.5px;font-weight:600;color:#111111;">{% block heading %}{% endblock %}</h1>
              <p style="margin:12px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.65;color:#4b4b4b;">{% block intro %}{% endblock %}</p>
            </td>
          </tr>

          {% block body %}{% endblock %}

          <tr>
            <td style="padding:28px 36px 32px 36px;">
              <div style="border-top:1px solid #e7e5df;padding-top:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:12px;line-height:1.6;color:#8a8a84;">
                <p style="margin:0;">This message was sent by Intradoc AI.</p>
                <p style="margin:6px 0 0 0;"><a href="{{ frontend_url }}" style="color:#6b6b66;text-decoration:underline;">{{ frontend_url }}</a></p>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
